name: Validate APEC variants
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Run native tests
        run: julia --project -e 'using Pkg; Pkg.test()'
      - name: Run SpectralFitting integration tests
        shell: julia {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/astro-group-bristol/AstroRegistry"))
          Pkg.develop(path = pwd())
          Pkg.add(Pkg.PackageSpec(name = "SpectralFitting", version = "0.7.4"))
          include(joinpath(pwd(), "test", "spectralfitting.jl"))
