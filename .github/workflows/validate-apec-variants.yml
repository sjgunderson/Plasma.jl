      part8: ${{ steps.inspect.outputs.part8 }}
      part9: ${{ steps.inspect.outputs.part9 }}
      part10: ${{ steps.inspect.outputs.part10 }}
      part11: ${{ steps.inspect.outputs.part11 }}
      part12: ${{ steps.inspect.outputs.part12 }}
      part13: ${{ steps.inspect.outputs.part13 }}
      part14: ${{ steps.inspect.outputs.part14 }}
      part15: ${{ steps.inspect.outputs.part15 }}
      part16: ${{ steps.inspect.outputs.part16 }}
      part17: ${{ steps.inspect.outputs.part17 }}
      part18: ${{ steps.inspect.outputs.part18 }}
      part19: ${{ steps.inspect.outputs.part19 }}
      part20: ${{ steps.inspect.outputs.part20 }}
      part21: ${{ steps.inspect.outputs.part21 }}
      part22: ${{ steps.inspect.outputs.part22 }}
