    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install LibXSPEC
        run: |
          julia --project="$RUNNER_TEMP/refenv" -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/astro-group-bristol/AstroRegistry"))
            Pkg.add(Pkg.PackageSpec(name="LibXSPEC_jll",version="6.35.1"))
          '
      - name: Read the public cooling-flow routine
        id: inspect
        run: |
          lib=$(julia --project="$RUNNER_TEMP/refenv" -e 'using LibXSPEC_jll; print(LibXSPEC_jll.libXSFunctions)')
          python - "$lib" <<'PY'
          import re, subprocess, sys, os, gzip, base64, struct
          from pathlib import Path
          library=sys.argv[1]
          raw=Path(library).read_bytes()
          symbols=subprocess.check_output(["nm","-S","--defined-only",library],text=True)
          selection=[line for line in symbols.splitlines() if re.search(r' (?:[tT]) (?:[bv]?[v]?cph|.*calcCoolingFlow.*|.*[Bb]olometric.*)$',line) and not re.search(r'cold|global|GLOBAL',line)]
          sections=subprocess.check_output(["objdump","-h",library],text=True)
          offsets=[tuple(int(x,16) for x in m) for m in re.findall(r'^\s*\d+\s+\.\w+\s+([0-9a-f]+)\s+([0-9a-f]+)\s+[0-9a-f]+\s+([0-9a-f]+)',sections,re.M)]
          lines=[]
          for candidate in selection:
              start,size,kind,sym=candidate.split()
              start,size=int(start,16),int(size,16)
              if size==0 or size>14000: continue
              dis=subprocess.check_output(["objdump","-Cd",f"--start-address={start}",f"--stop-address={start+size}",library],text=True)
              insns=[]
              for row in dis.splitlines():
                  if "\t" not in row: continue
                  fields=row.split("\t")
                  asm=fields[-1].strip()
                  m=re.search(r'#\s*([0-9a-f]+)',asm)
                  if m and "(%rip)" in asm:
                      address = int(m[1],16)
                      for count,vm,offset in offsets:
                          if vm <= address < vm+count:
                              at=offset+address-vm
                              buf=raw[at:at+8]
                              if (asm.startswith("movsd") or asm.startswith("mulsd") or asm.startswith("comisd") or asm.startswith("divsd") or asm.startswith("addsd")) and len(buf)==8:
                                  asm+=" f64="+format(struct.unpack("<d",buf)[0],".12g")
                              elif asm.startswith("lea"):
                                  buf=raw[at:at+70].split(b"\0",1)[0]
                                  if buf and all(32<=v<127 for v in buf):
                                      asm+=" "+buf.decode()
                              break
                  insns.append(fields[0].strip()+" "+asm)
              lines.extend(["-- "+candidate, *insns])
          payload="\n".join([*selection, *lines])
          print(payload)
          data=base64.b64encode(gzip.compress(payload.encode())).decode()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for i in range(80):
                  print(f"part{i}="+data[i*220:(i+1)*220],file=out)
          PY
