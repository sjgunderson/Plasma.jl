name: Inspect XSPEC cflow weighting and table metadata
on:
  push:
    branches: [power-law-cflow-reference]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  JULIA_PKG_PRECOMPILE_AUTO: '0'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      file: ${{ steps.info.outputs.file }}
      params: ${{ steps.info.outputs.params }}
      energies: ${{ steps.info.outputs.energies }}
      spectra: ${{ steps.info.outputs.spectra }}
      sample: ${{ steps.info.outputs.sample }}
      slope: ${{ steps.info.outputs.slope }}
      error: ${{ steps.info.outputs.error }}
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install the reference library
        run: |
          julia --project="$RUNNER_TEMP/refenv" -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/astro-group-bristol/AstroRegistry"))
            Pkg.add(Pkg.PackageSpec(name="LibXSPEC_jll",version="6.35.1"))
          '
      - name: Read the legacy XSPEC table and calculation constants
        id: info
        run: |
          lib=$(julia --project="$RUNNER_TEMP/refenv" -e 'using LibXSPEC_jll; print(LibXSPEC_jll.libXSFunctions)')
          table=$(find "$(dirname "$lib")/.." -iname raysmith.mod -print -quit)
          if [[ -z "$table" ]]; then
              table="$RUNNER_TEMP/raysmith.mod"
              curl -fsSL --retry 1 --max-time 35 -o "$table" https://heasarc.gsfc.nasa.gov/FTP/software/xspec/spectral/modelData/raysmith.mod || true
          fi
          python - "$lib" "$table" <<'PY'
          import os, subprocess, re, struct, sys
          from pathlib import Path
          def output(k,v):
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  print(f"{k}={v}",file=out)
              print(k,v)
          lib,tab=map(Path,sys.argv[1:])
          entry=next(v for v in subprocess.check_output(["nm","-S","--defined-only",lib],text=True).splitlines() if v.split()[-1].startswith("_Z15calcCoolingFlow") and v.split()[2]=="T")
          start=int(entry.split()[0],16)
          dis=subprocess.check_output(["objdump","--insn-width=12","-Cd",f"--start-address={start+0x1350}",f"--stop-address={start+0x15a0}",lib],text=True)
          raw=lib.read_bytes()
          sec=subprocess.check_output(["objdump","-h",lib],text=True)
          offsets=[tuple(int(x,16) for x in m) for m in re.findall(r'^\s*\d+\s+\.\w+\s+([0-9a-f]+)\s+([0-9a-f]+)\s+[0-9a-f]+\s+([0-9a-f]+)',sec,re.M)]
          constants=[]
          for line in dis.splitlines():
              m=re.search(r'\b(?:movsd|divsd|mulsd)\s+.*\(%rip\).*#\s*([0-9a-f]+)',line)
              if m:
                  a=int(m[1],16)
                  for size,vm,fi in offsets:
                      if vm<=a<vm+size:
                          val=struct.unpack_from("<d",raw,fi+a-vm)[0]
                          constants.append(f"{line.split(':')[0].strip()}:{val:g}")
                          break
          output("slope",",".join(constants))
          print(dis)
          if not tab.is_file():
              output("error","raysmith.mod not found")
              sys.exit(0)
          output("file",str(tab.stat().st_size))
          with tab.open("rb") as f:
              for index,key in enumerate(("primary","params","energies","spectra")):
                  header={}
                  while True:
                      block=f.read(2880).decode("ascii","replace")
                      stop=False
                      for i in range(0,len(block),80):
                          card=block[i:i+80]; name=card[:8].strip()
                          if name=="END":
                              stop=True;break
                          if card[8:10]=="= ":
                              header[name]=card[10:].split(" /",1)[0].strip().strip("'").strip()
                      if stop or len(block)<2880:break
                  if index==0:
                      continue
                  n=int(header["NAXIS1"])*int(header["NAXIS2"])+int(header.get("PCOUNT",0))
                  data=f.read(n)
                  f.seek((-n)%2880,1)
                  output(key," ".join(k+":"+header[k] for k in header if k in ("EXTNAME","NAXIS2","NADDPARM","NINTPARM","TFIELDS") or k.startswith("TTYPE")))
                  if key=="params":
                      row=data[:int(header["NAXIS1"])]
                      fields=[]
                      fmt={"A":"s","J":"i","E":"f","D":"d","I":"h"}
                      cursor=0
                      for field in range(1,int(header["TFIELDS"])+1):
                          match=re.fullmatch(r"(\d*)([AJEDI])",header["TFORM"+str(field)])
                          if not match: break
                          count=int(match[1] or 1); code=fmt[match[2]]; fmtstr=">"+str(count)+code
                          vals=struct.unpack_from(fmtstr,row,cursor)
                          cursor+=struct.calcsize(fmtstr)
                          name=header["TTYPE"+str(field)]
                          if name in ("NAME","METHOD","NUMBVALS","VALUE"):
                              fields.append(f"{name}={vals[:4]}")
                      output("sample"," ".join(fields))
          PY
  report:
    if: always()
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - name: "file ${{ needs.inspect.outputs.file }}"
        run: 'true'
      - name: "params ${{ needs.inspect.outputs.params }}"
        run: 'true'
      - name: "energies ${{ needs.inspect.outputs.energies }}"
        run: 'true'
      - name: "spectra ${{ needs.inspect.outputs.spectra }}"
        run: 'true'
      - name: "sample ${{ needs.inspect.outputs.sample }}"
        run: 'true'
      - name: "slope ${{ needs.inspect.outputs.slope }}"
        run: 'true'
      - name: "error ${{ needs.inspect.outputs.error }}"
        run: 'true'
