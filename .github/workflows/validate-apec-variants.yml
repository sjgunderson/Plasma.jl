name: Read the XSPEC bolometric energy grid
on: [push]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  JULIA_PKG_PRECOMPILE_AUTO: '0'
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      grid: ${{ steps.metadata.outputs.grid }}
      detail: ${{ steps.metadata.outputs.detail }}
      distance: ${{ steps.metadata.outputs.distance }}
      error: ${{ steps.metadata.outputs.error }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install LibXSPEC
        run: |
          julia --project="$RUNNER_TEMP/refenv" -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/astro-group-bristol/AstroRegistry"))
            Pkg.add(Pkg.PackageSpec(name="LibXSPEC_jll",version="6.35.1"))
          '
      - name: Download the reference AtomDB FITS pair
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 1 --max-time 120 -o atomdb.tar.bz2 https://hea-www.cfa.harvard.edu/AtomDB/releases/atomdb_v3.1.3.tar.bz2
          tar -xjf atomdb.tar.bz2 --wildcards '*/apec_v3.1.3_coco.fits' '*/apec_v3.1.3_line.fits'
      - name: Read grid metadata
        id: metadata
        run: |
          cat > "$RUNNER_TEMP/grid.jl" <<'JULIA'
          using LibXSPEC_jll, Libdl, Printf
          const lib = LibXSPEC_jll.libXSFunctions
          const utilpath = LibXSPEC_jll.libXSUtil
          ccall((:FNINIT, lib), Cvoid, ())
          ccall((:FPMSTR, lib), Cvoid, (Cstring, Cstring), "APECROOT", ARGS[1])
          function report(key, value)
              open(ENV["GITHUB_OUTPUT"], "a") do io
                  println(io,key,"=",value)
              end
          end
          function find_symbol(library, target)
              rows = split(read(`nm -D $library`, String),'\n')
              return Symbol(last(split(first(filter(line -> occursin(target,line) && occursin(" T ",line), rows)))))
          end
          gridfn=find_symbol(lib,"plasmaFileInfo")
          energy=zeros(UInt,2)
          temp=zeros(UInt,2)
          h=dlopen(lib)
          status=ccall(dlsym(h,gridfn),Cint,(Cint,Ptr{UInt},Ptr{UInt}),6,energy,temp)
          report("detail","symbol=$(gridfn) status=$(status) grid=$(energy[1]) temps=$(temp[1])")
          es=unsafe_wrap(Vector{Float64},Ptr{Float64}(energy[2]),Int(energy[1]))
          probes=unique([1,2,3,4,5,6,10,100,length(es)÷2,length(es)-1,length(es)])
          report("grid",join(["$i:"*@sprintf("%.12g",es[i]) for i in probes if 1<=i<=length(es)],","))
          if length(es)>3
              report("detail","n=$(length(es)) max log-step error=$(maximum(abs,diff(log.(es)) .- log(es[end]/es[1])/(length(es)-1))) max linear-step error=$(maximum(abs,diff(es) .- (es[end]-es[1])/(length(es)-1)))")
          end
          try
              fn=find_symbol(utilpath,"FZSQcl")
              util=dlopen(utilpath)
              p=dlsym(util,fn)
              vals=map([.08,.2,.3,1.]) do z
                  sqrt(ccall(p,Cdouble,(Ptr{Cvoid},Cdouble,Cdouble,Cdouble),C_NULL,z,0.,Float64(Float32(.73))))
              end
              report("distance",join(vals,","))
          catch err
              report("distance",repr(err))
          end
          JULIA
          linefile=$(find "$RUNNER_TEMP" -name 'apec_v3.1.3_line.fits' -print -quit)
          trap 'echo "error=$(grep -E "ERROR:|LoadError|signal" "$RUNNER_TEMP/grid.log" | head -2 | tr "\n" " " | cut -c1-210)" >> "$GITHUB_OUTPUT"' ERR
          julia --project="$RUNNER_TEMP/refenv" "$RUNNER_TEMP/grid.jl" "${linefile%_line.fits}" 2>&1 | tee "$RUNNER_TEMP/grid.log"
  report:
    if: always()
    needs: reference
    runs-on: ubuntu-latest
    steps:
      - name: "Grid ${{ needs.reference.outputs.grid }}"
        run: 'true'
      - name: "Detail ${{ needs.reference.outputs.detail }}"
        run: 'true'
      - name: "Cosmology ${{ needs.reference.outputs.distance }}"
        run: 'true'
      - name: "Error ${{ needs.reference.outputs.error }}"
        run: 'true'
