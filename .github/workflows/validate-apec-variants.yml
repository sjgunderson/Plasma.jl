name: Inspect public HEASoft model source
on: [push]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      part0: ${{ steps.inspect.outputs.part0 }}
      part1: ${{ steps.inspect.outputs.part1 }}
      part2: ${{ steps.inspect.outputs.part2 }}
      part3: ${{ steps.inspect.outputs.part3 }}
