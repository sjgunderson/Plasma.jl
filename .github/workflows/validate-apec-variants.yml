      part25: ${{ steps.inspect.outputs.part25 }}
      part26: ${{ steps.inspect.outputs.part26 }}
      part27: ${{ steps.inspect.outputs.part27 }}
      part28: ${{ steps.inspect.outputs.part28 }}
      part29: ${{ steps.inspect.outputs.part29 }}
      part30: ${{ steps.inspect.outputs.part30 }}
      part31: ${{ steps.inspect.outputs.part31 }}
      part32: ${{ steps.inspect.outputs.part32 }}
      part33: ${{ steps.inspect.outputs.part33 }}
      part34: ${{ steps.inspect.outputs.part34 }}
      part35: ${{ steps.inspect.outputs.part35 }}
      part36: ${{ steps.inspect.outputs.part36 }}
      part37: ${{ steps.inspect.outputs.part37 }}
    steps:
      - name: Retrieve the XSPEC cooling model implementation
        id: inspect
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          curl -fsSL --retry 1 --max-time 270 https://heasarc.gsfc.nasa.gov/FTP/software/lheasoft/lheasoft6.35.2/heasoft-6.35.2src.tar.gz | tar xzf - --wildcards '*/Xspec/src/XSFunctions/*'
          ls */Xspec/src/XSFunctions | grep -Ei 'cool|cph|xsvmcf|sumdem'
          {
          ls */Xspec/src/XSFunctions | grep -Ei 'cool|cph|xsvmcf|sumdem'
          grep -inE 'pow\(|bolo|peak|norm =|CFLOW|dlog|cph' */Xspec/src/XSFunctions/{coolflow,cph,xsvmcf,sumdem,calcMultiTempPlasma}.cxx | sed -E 's|^.+/([^/]+\.cxx):|\1: |' | cut -c1-110
          } > "$RUNNER_TEMP/excerpts"
          python - <<'PY'
          import os
          from pathlib import Path
          lines=Path(os.environ["RUNNER_TEMP"],"excerpts").read_text().splitlines()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for i in range(38):
                  print("part" + str(i) + "=" + " / ".join(lines[3*i:3*i+3]), file=out)
          PY
  report:
    if: always()
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: "part0 ${{ needs.source.outputs.part0 }}"
        run: 'true'
      - name: "part1 ${{ needs.source.outputs.part1 }}"
